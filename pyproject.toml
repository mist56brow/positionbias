[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mist56brow-positionbias"
version = "0.1.0"
description = "在同一个输入里两两比对，检测评测裁判的位置偏差相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mist56brow" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mist56brow.github.io"
Repository = "https://github.com/mist56brow/positionbias"
Issues = "https://github.com/mist56brow/positionbias/issues"

[project.scripts]
positionbias = "positionbias:main"

[tool.setuptools]
py-modules = ["positionbias"]
